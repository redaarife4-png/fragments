backend:
  name: github
  repo: redaarife4-png/fragments
  branch: main

# Where uploaded images/videos are stored
media_folder: "public/uploads"
public_folder: "/uploads"

# Site metadata
site_url: https://redarif.netlify.app
display_url: https://redarif.netlify.app

# UI language of the CMS itself
locale: 'fr'

collections:
  - name: "posts"
    label: "Articles"
    label_singular: "Article"
    description: "Essais, carnets de voyage, notes courtes."
    folder: "src/content/posts"
    create: true
    # Use the French title as the readable identifier for filenames and summaries
    identifier_field: title_fr
    # Filename pattern: 2026-08-16-mon-titre-slugifie.md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title_fr}} · {{category}} · {{date | date('DD/MM/YYYY')}}"
    fields:
      - label: "Titre (FR)"
        name: "title_fr"
        widget: "string"
      - label: "Titre (EN)"
        name: "title_en"
        widget: "string"
      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Essai", value: "essai" }
          - { label: "Carnet de voyage", value: "voyage" }
          - { label: "Note courte", value: "note" }
          - { label: "Avis", value: "avis" }
      - label: "Chapeau (FR)"
        name: "dek_fr"
        widget: "text"
        required: false
        hint: "Sous-titre italique affiché sous le titre de l'article"
      - label: "Chapeau (EN)"
        name: "dek_en"
        widget: "text"
        required: false
      - label: "Extrait (FR)"
        name: "excerpt_fr"
        widget: "text"
        hint: "Résumé court affiché sur la page d'accueil (2-3 phrases)"
      - label: "Extrait (EN)"
        name: "excerpt_en"
        widget: "text"
      - label: "Corps de l'article (FR)"
        name: "body_fr"
        widget: "markdown"
      - label: "Corps de l'article (EN)"
        name: "body_en"
        widget: "markdown"
